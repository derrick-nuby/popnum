<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>PopNum</h1>
    
    <div class="config-section">
      <label for="minValue">Minimum Value:</label>
      <input type="number" id="minValue" value="500">
      
      <label for="maxValue">Maximum Value:</label>
      <input type="number" id="maxValue" value="1000">
    </div>
    
    <div class="button-group">
      <button id="fillButton">Fill Fields</button>
      <button id="clearButton">Clear Fields</button>
    </div>
    
    <div id="status"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
